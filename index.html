<!doctype html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
  <script>
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('intro');

  <style>
    :root{
      --u: max( min(calc(100vw / 1563), calc(100vh / 460)), 0.80px );

      --ink-sub:rgba(255,255,255,.50); --ink-pill:rgba(255,255,255,.88); --ink-dark:#000000;

    }
    @supports (height:100dvh){ :root{ --u: max( min(calc(100vw / 1563), calc(100dvh / 460)), 0.80px ); } }
    @supports not (width: max(1px,1vw)){ :root{ --u: calc(100vw / 1563); } }
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:#000;color:#fff;overflow:hidden;font-optical-sizing:none;font-feature-settings:"kern" 1,"calt" 1;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
    a:focus-visible,button:focus-visible{outline:2px solid #9b8cff;outline-offset:3px;border-radius:4px}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .frame{position:fixed;inset:0;overflow:hidden;background:#000;isolation:isolate}
    .sky{position:absolute;top:calc(-1.5 * var(--u));left:50%;transform:translateX(-50%);width:100%;height:auto;min-height:calc(100% + 1.5 * var(--u));object-fit:cover;object-position:center top;z-index:0;pointer-events:none;user-select:none}
    .veil{position:absolute;inset:0;background:rgba(0,0,0,.06);z-index:1;pointer-events:none}
    .bar{position:absolute;left:calc(50% - 495.5 * var(--u));top:calc(7.5 * var(--u));width:calc(983.5 * var(--u));height:calc(36.2 * var(--u));z-index:3}
    .brand{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:calc(11.4 * var(--u));color:var(--ink-mark);text-decoration:none;white-space:nowrap}

    .links{position:absolute;left:calc(353.8 * var(--u));top:50%;transform:translateY(-50%);display:flex;gap:calc(25.2 * var(--u))}
    .links a{font-size:calc(11.9 * var(--u));font-weight:450;font-variation-settings:'opsz' 15;letter-spacing:calc(-.30 * var(--u));color:var(--ink-nav);text-decoration:none;white-space:nowrap;transition:color .18s ease}

    .solid{background:#fff;color:var(--ink-dark)}
    .solid:hover{background:#e9e9ea}
    .bar .btn{height:calc(36.2 * var(--u));line-height:calc(36.2 * var(--u));font-size:calc(11.9 * var(--u));font-weight:500;font-variation-settings:'opsz' 15;letter-spacing:calc(-.38 * var(--u))}
    .bar .ghost{width:calc(85.5 * var(--u))}
    .bar .solid{width:calc(88.2 * var(--u));font-size:calc(12.15 * var(--u));font-weight:550;letter-spacing:calc(-.35 * var(--u))}
    .menu{display:none;align-items:center;justify-content:center;width:calc(36.2 * var(--u));height:calc(36.2 * var(--u));border-radius:var(--r-btn);border:calc(1 * var(--u)) solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer;padding:0}

    .sheet{display:none;position:absolute;top:calc(100% + 9 * var(--u));right:0;min-width:calc(210 * var(--u));padding:calc(10 * var(--u));border-radius:calc(14 * var(--u));background:rgba(18,18,20,.88);border:calc(1 * var(--u)) solid rgba(255,255,255,.15);-webkit-backdrop-filter:blur(calc(18 * var(--u))) saturate(140%);backdrop-filter:blur(calc(18 * var(--u))) saturate(140%);box-shadow:0 calc(18 * var(--u)) calc(44 * var(--u)) rgba(0,0,0,.55)}
    .bar[data-open="true"] .sheet{display:block}
    .sheet a:not(.btn){display:block;padding:calc(9 * var(--u)) calc(10 * var(--u));border-radius:calc(9 * var(--u));color:var(--ink-nav);text-decoration:none;font-size:calc(14 * var(--u));font-weight:450;font-variation-settings:'opsz' 15;letter-spacing:calc(-.30 * var(--u))}
    .sheet a:not(.btn):hover{background:rgba(255,255,255,.08);color:#fff}
    .bar .sheet .solid{display:flex;width:100%;height:calc(38 * var(--u));margin-top:calc(8 * var(--u));font-size:calc(14 * var(--u));font-weight:500;font-variation-settings:'opsz' 15;letter-spacing:calc(-.30 * var(--u));color:#000}
    .screen{position:absolute;top:0;left:50%;transform:translateX(-50%);width:calc(1563 * var(--u));height:calc(1006 * var(--u));z-index:2}
    .hero{position:absolute;left:calc(.9 * var(--u));right:calc(-.9 * var(--u));top:0;text-align:center}
    .pill{position:absolute;top:calc(129.6 * var(--u));left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;width:calc(194.5 * var(--u));height:calc(22.4 * var(--u));padding-left:calc(4.0 * var(--u));padding-right:calc(8.6 * var(--u));border-radius:999px;background:var(--glass-bg);border:calc(1 * var(--u)) solid var(--glass-line);-webkit-backdrop-filter:blur(calc(10 * var(--u)));backdrop-filter:blur(calc(10 * var(--u)));text-decoration:none;white-space:nowrap;transition:background-color .18s ease}
    .pill:hover{background:rgba(255,255,255,.17)}
    .chip{display:inline-flex;align-items:center;justify-content:center;width:calc(33.3 * var(--u));height:calc(14 * var(--u));border-radius:999px;background:#fff;color:#000;font-size:calc(10.2 * var(--u));font-weight:600;font-variation-settings:'opsz' 14;padding-top:calc(1.7 * var(--u));letter-spacing:calc(-.1 * var(--u));line-height:1}
    .pill-label{margin-left:calc(3.4 * var(--u));position:relative;top:calc(1 * var(--u));color:var(--ink-pill);font-size:calc(12.4 * var(--u));font-weight:450;font-variation-settings:'opsz' 15;letter-spacing:calc(-.48 * var(--u));height:calc(22.4 * var(--u));line-height:calc(22.4 * var(--u))}
    .pill svg{width:calc(9.5 * var(--u));height:calc(8 * var(--u));margin-left:auto;color:rgba(255,255,255,.95)}
    .hero h1{position:absolute;left:calc(.6 * var(--u));right:calc(-.6 * var(--u));top:calc(168.5 * var(--u));margin:0;font-size:calc(55 * var(--u));font-weight:545;font-variation-settings:'opsz' 32;line-height:calc(56 * var(--u));letter-spacing:calc(-.76 * var(--u));color:#fff}
    .ln{display:block;overflow:hidden;padding-bottom:calc(7 * var(--u));margin-bottom:calc(-7 * var(--u))}
    .ln-i{display:block}
    .hero p{position:absolute;left:50%;transform:translateX(calc(-50% + .25 * var(--u)));top:calc(292.6 * var(--u));margin:0;width:calc(700 * var(--u));font-size:calc(15.7 * var(--u));font-weight:400;font-variation-settings:'opsz' 20;line-height:calc(24 * var(--u));letter-spacing:calc(-.05 * var(--u));color:var(--ink-sub)}
    .cta{position:absolute;left:50%;transform:translateX(-50%);top:calc(342.8 * var(--u));display:flex;gap:calc(9.9 * var(--u))}
    .cta .btn{height:calc(36.4 * var(--u));line-height:calc(36.4 * var(--u));padding-top:calc(2 * var(--u));font-size:calc(13.3 * var(--u));font-weight:480;font-variation-settings:'opsz' 16;letter-spacing:calc(-.34 * var(--u))}
    .cta .ghost{width:calc(99.6 * var(--u))}
    .cta .solid{width:calc(96.4 * var(--u))}
    @media (max-width:1023px){:root{--u:calc(100vw / 900)}.bar{left:4.2vw;width:91.6vw}.links,.actions > .solid{display:none}.menu{display:inline-flex}}
    @media (max-width:640px){:root{--u:calc(100vw / 486)}.bar{left:5.2vw;width:89.6vw}.hero p{width:min(calc(560 * var(--u)),88vw);line-height:calc(23 * var(--u))}.pill{padding-right:calc(8 * var(--u))}}
    @media (max-width:380px){:root{--u:calc(100vw / 470)}}
    @media (max-width:1023px) and (max-height:520px){:root{--u:min(calc(100vw / 900),calc(100vh / 470))}}
    @media (min-aspect-ratio:3/1){.sky{top:auto;bottom:0;height:auto;min-height:0;width:100%;min-width:100%}.veil{background:linear-gradient(to bottom,rgba(0,0,0,.82) 0%,rgba(0,0,0,.72) 55%,rgba(0,0,0,.18) 100%)}}
    @media (prefers-reduced-motion:no-preference){
      :root{--e-reveal:cubic-bezier(.18,.85,.26,1);--e-soft:cubic-bezier(.22,1,.36,1);--e-nav:cubic-bezier(.33,1,.68,1);--rise:calc(10 * var(--u));--rise-lg:calc(13 * var(--u))}
      .intro .brand,.intro .links a,.intro .actions > .btn,.intro .actions > .menu,.intro .pill,.intro .hero p,.intro .cta .btn{opacity:0}
      .intro .ln-i{transform:translate3d(0,115%,0)}
      .intro .brand,.intro .pill,.intro .hero p,.intro .ln-i,.intro .cta .btn{will-change:transform,opacity}
      @keyframes i-rise{from{opacity:0;transform:translate3d(0,var(--rise),0)}to{opacity:1;transform:none}}
      @keyframes i-rise-cy{from{opacity:0;transform:translateY(-50%) translate3d(0,var(--rise),0)}to{opacity:1;transform:translateY(-50%)}}
      @keyframes i-pill{from{opacity:0;transform:translateX(-50%) translate3d(0,var(--rise-lg),0) scale(.972)}to{opacity:1;transform:translateX(-50%)}}
      @keyframes i-sub{from{opacity:0;transform:translateX(calc(-50% + .25 * var(--u))) translate3d(0,var(--rise-lg),0)}to{opacity:1;transform:translateX(calc(-50% + .25 * var(--u)))}}
      @keyframes i-btn{from{opacity:0;transform:translate3d(0,var(--rise-lg),0) scale(.986)}to{opacity:1;transform:none}}
      @keyframes i-line{from{transform:translate3d(0,115%,0)}to{transform:none}}
      .intro-play .brand{animation:i-rise-cy .62s var(--e-nav) 0s both}
      .intro-play .links a{animation:i-rise .55s var(--e-nav) both}
      .intro-play .links a:nth-child(1){animation-delay:.070s}.intro-play .links a:nth-child(2){animation-delay:.115s}.intro-play .links a:nth-child(3){animation-delay:.160s}.intro-play .links a:nth-child(4){animation-delay:.205s}.intro-play .links a:nth-child(5){animation-delay:.250s}
      .intro-play .actions > .btn,.intro-play .actions > .menu{animation:i-rise .55s var(--e-nav) .215s both}
      .intro-play .actions > .ghost{animation-delay:.160s}
      .intro-play .pill{animation:i-pill .62s var(--e-soft) .26s both}
      .intro-play .ln-i{animation:i-line .95s var(--e-reveal) .34s both}
      .intro-play .ln:nth-child(2) .ln-i{animation-delay:.48s}
      .intro-play .hero p{animation:i-sub .70s var(--e-soft) .86s both}
      .intro-play .cta .btn:nth-child(1){animation:i-btn .62s var(--e-soft) 1.00s both}
      .intro-play .cta .btn:nth-child(2){animation:i-btn .62s var(--e-soft) 1.07s both}
    }
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="frame">
    <video class="sky" aria-hidden="true" autoplay muted loop playsinline preload="auto" poster="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/0bf7409c-9fa2-4bef-a49d-34903dcc91ad.png" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/4b73c700-3112-4c07-bd48-0af2893dff7c.mp4"></video>
    <div class="veil"></div>
    <header class="bar">
      <a class="brand" href="/" aria-label="Orbit — home"><svg viewBox="0 0 26.9 16.6" aria-hidden="true"><ellipse cx="13.25" cy="8.4" rx="13.2" ry="2.9" transform="rotate(-25 13.25 8.4)" stroke="currentColor" stroke-width="1.25"/><circle cx="13.25" cy="8.4" r="8.8" fill="#000"/><circle cx="13.25" cy="8.4" r="8.1" fill="currentColor"/><ellipse cx="13.25" cy="8.4" rx="13.2" ry="2.9" transform="rotate(-25 13.25 8.4)" stroke="#000" stroke-width="0.9" stroke-dasharray="28.2 28.2"/><ellipse cx="13.25" cy="8.4" rx="13.2" ry="2.9" transform="rotate(-25 13.25 8.4)" stroke="currentColor" stroke-width="1.25" stroke-dasharray="28.2 28.2"/></svg><span>Orbit</span></a>

      <div class="actions">

        <button class="menu" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false" aria-controls="menu-sheet"><svg viewBox="0 0 20 14" fill="none" aria-hidden="true"><path d="M0 1h20M0 7h20M0 13h20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <nav class="sheet" id="menu-sheet" aria-label="Menu"><a href="#about" data-i18n="About">About</a><a href="#features" data-i18n="Features">Features</a><a href="#pricing" data-i18n="Pricing">Pricing</a><a href="#contact" data-i18n="Contact">Contact</a><a href="#blog" data-i18n="Blog">Blog</a><a class="btn solid" href="#demo" data-i18n="Get a demo">Get a demo</a><button class="lang-toggle" data-language-toggle type="button">ไทย</button></nav>

      <a class="pill" href="#new"><span class="chip">New</span><span class="pill-label">Go beyond the ordinary</span><svg viewBox="0 0 9.5 8" fill="none" aria-hidden="true"><path d="M0.7 4H8.8M5.6 0.75 8.85 4 5.6 7.25" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      <h1><span class="ln"><span class="ln-i">See beyond now</span></span><span class="ln"><span class="ln-i">Explore the stars</span></span></h1>

    </main></div>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      if (root.classList.contains('intro')) {
        let started = false;
        let cleared = false;
        let timer;
        const clear = () => {
          if (cleared) return;
          cleared = true;
          clearTimeout(timer);
          root.classList.remove('intro', 'intro-play');
        };
        const start = () => {
          if (started || !root.classList.contains('intro')) return;
          started = true;
          root.classList.add('intro-play');
          timer = setTimeout(clear, 3000);
        };
        const lastButton = document.querySelector('.cta .btn:last-child');
        lastButton.addEventListener('animationend', event => { if (event.target === lastButton) clear(); });
        let ready = false;
        const schedule = () => {
          if (ready) return;
          ready = true;
          requestAnimationFrame(() => requestAnimationFrame(start));
        };
        // The fallback only releases the animation when the requested face can render.
        const fallback = setTimeout(() => { if (document.fonts.check('545 55px Inter')) schedule(); }, 700);
        document.fonts.ready.then(() => { clearTimeout(fallback); schedule(); }, schedule);
      }

      const bar = document.querySelector('.bar');
      const button = document.getElementById('menu-btn');
      const set = open => {
        bar.dataset.open = String(open);
        button.setAttribute('aria-expanded', String(open));
        button.setAttribute('aria-label', open ? 'Close menu' : 'Menu');
      };
      set(false);
      button.addEventListener('click', event => { event.stopPropagation(); set(bar.dataset.open !== 'true'); });
      document.addEventListener('click', event => { if (!bar.contains(event.target)) set(false); });
      document.addEventListener('keydown', event => { if (event.key === 'Escape') set(false); });

      const v = document.querySelector('video.sky');
      v.muted = true;
      const play = () => { if (v.paused) { const attempt = v.play(); if (attempt && typeof attempt.catch === 'function') attempt.catch(() => {}); } };
      play();
      v.addEventListener('canplay', play);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) play(); });
      ['pointerdown', 'touchstart', 'scroll'].forEach(type => window.addEventListener(type, play, { once:true, passive:true }));

      const destinations = { about:'overview', features:'sightings', pricing:'import', contact:'detections', blog:'analytics', try:'overview', demo:'detections', new:'sightings', explore:'map' };
      document.querySelectorAll('a[href^="#"]').forEach(link => link.addEventListener('click', event => {
        const route = destinations[link.getAttribute('href').slice(1)];
        if (route) { event.preventDefault(); window.location.href = '/console#/' + route; }
      }));
    })();
  </script>
<script src="/static/i18n.js"></script>
</body>
